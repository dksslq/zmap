name: build-zmap-musl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            git \
            cmake \
            make \
            gcc \
            g++ \
            musl-dev \
            pkgconf \
            linux-headers \
            flex \
            bison \
            gengetopt \
            byacc \
            # 下面的 -dev 包提供头文件和 .so（用于 CMake 检测）
            gmp-dev \
            json-c-dev \
            libpcap-dev \
            libunistring-dev \
            judy-dev \
            # 下面的 -static 包提供 .a 静态库，是真正链接时需要的
            gmp-dev \
            json-c-static \
            libpcap-static \
            libunistring-static \
            judy-static \
            zlib-static \
            # 其他工具
            file \
            tar \
            gzip

      - name: Checkout
        uses: actions/checkout@v4

      # 这个步骤其实不需要单独存在，环境变量在 configure 步骤中通过
      # -DCMAKE_C_FLAGS 和 -DCMAKE_EXE_LINKER_FLAGS 已经传入，可删除或保留。
      # 为保持清晰，我把它去掉了。

      - name: Configure ZMap
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-static -O3" \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DENABLE_DEVELOPMENT=OFF

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Check binary
        run: |
          file build/src/zmap
          ldd build/src/zmap || true

      - name: Package
        run: |
          mkdir dist
          cp build/src/zmap dist/
          tar czf zmap-musl-x86_64.tar.gz -C dist zmap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmap-musl-x86_64
          path: zmap-musl-x86_64.tar.gz
